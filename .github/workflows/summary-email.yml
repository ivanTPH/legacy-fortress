name: Legacy Fortress TEST daily jobs

# Daily jobs on TEST: delete ID evidence past its retention date (photos of checks never finished, or
# whose deletion failed), then send summary emails that are due (V5.2 m3). On TEST only
# people who chose a frequency themselves are emailed, and synthetic addresses never are.
# The request is signed with the server's key; the key itself is never sent.
on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-fortress-summary-email
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: legacy-fortress-staging
    steps:
      - name: Ask TEST to run its daily jobs
        env:
          SIGNING_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          BASE_URL: https://test.mylegacyfortress.com
        run: |
          set -euo pipefail
          ts="$(date +%s)"
          sig="$(printf 'lf-summary-email:%s' "$ts" | openssl dgst -sha256 -hmac "$SIGNING_KEY" -hex | sed 's/^.*= //')"
          status="$(curl -sS -o result.json -w '%{http_code}' -X POST "$BASE_URL/api/internal/daily/run" -H "x-lf-timestamp: $ts" -H "x-lf-signature: $sig")"
          echo "HTTP $status"
          # Counts only.
          node -e 'const r=require("./result.json"); console.log(JSON.stringify({ok:r.ok,evidence:r.evidence,summaries:r.summaries}))'
          test "$status" = "200"
