name: TEST demo screenshots

# Runs when ops/demo-screenshots-request.json changes on the TEST branch (manual dispatch only works from main).
on:
  push:
    branches: [hosted-uat-preparation-20260715]
    paths: [ops/demo-screenshots-request.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-fortress-demo-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-24.04 # Playwright browsers are not yet supported on ubuntu-latest (26.04), 9 Nov 2026
    environment: legacy-fortress-staging
    steps:
      - name: Confirm staging branch
        run: test "${GITHUB_REF_NAME}" = "hosted-uat-preparation-20260715"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wait until TEST is serving this version
        # Merging the request redeploys TEST; photographing mid-deploy shows old pages and errors (10 Nov 2026).
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS -m 10 https://test.mylegacyfortress.com/api/version | sed -n 's/.*"commitSha":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ "$live" = "${GITHUB_SHA}" ]; then echo "TEST is on ${GITHUB_SHA}"; sleep 20; exit 0; fi
            echo "Waiting for TEST (live ${live:-unknown}, want ${GITHUB_SHA})"; sleep 20
          done
          echo "TEST did not reach ${GITHUB_SHA} within 20 minutes"; exit 1
      - name: Photograph a synthetic demo account
        env:
          PLAYWRIGHT_BASE_URL: https://test.mylegacyfortress.com
          NEXT_PUBLIC_SUPABASE_URL: https://supabase-test.mylegacyfortress.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          LEGACY_FORTRESS_ALLOW_STAGING_BROWSER: "true"
        run: |
          # The runner's Ubuntu mirror sometimes fails to resolve (11 Nov 2026): retry, then use the browser alone.
          # The runner's Ubuntu mirror sometimes can't be reached; give the extra system parts one bounded try,
          # then carry on with just the browser (the runner already has what Chromium needs).
          timeout 480 npx playwright install --with-deps chromium || npx playwright install chromium
          # A request may name one check to run ("grep"), for a quick diagnosis; otherwise everything runs.
          GREP=$(node -e 'try{const r=require("./ops/demo-screenshots-request.json");process.stdout.write(String(r.grep||"").replace(/[^A-Za-z0-9 ()-]/g,""))}catch{}')
          if [ -n "$GREP" ]; then
            npx playwright test tests/e2e/staging-demo-screenshots.spec.ts --project=desktop-chromium --retries=0 --grep "$GREP"
          else
            npx playwright test tests/e2e/staging-demo-screenshots.spec.ts --project=desktop-chromium --retries=0
          fi
      - name: Show what the page held when a check failed
        if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "== $1"; head -c 6000 "$1"' _ {} \; || true
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: test-results/demo-shots/
          retention-days: 7
