name: Legacy Fortress staging release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to deploy and accept
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: legacy-fortress-staging
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: legacy-fortress-staging
    steps:
      - name: Confirm staging branch
        run: test "${GITHUB_REF_NAME}" = "hosted-uat-preparation-20260715"

      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Confirm checked-out commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BRANCH: hosted-uat-preparation-20260715
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin "refs/heads/${EXPECTED_BRANCH}:refs/remotes/origin/${EXPECTED_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${EXPECTED_BRANCH}")" = "$EXPECTED_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Deploy, verify and run hosted IDV acceptance
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          BASE_URL: https://test.mylegacyfortress.com
          NEXT_PUBLIC_SUPABASE_URL: https://supabase-test.mylegacyfortress.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          LEGACY_FORTRESS_ALLOW_STAGING_ACCEPTANCE: "true"
          APP_ENV: staging
          LEGACY_FORTRESS_ENV: staging
          EXPECTED_STAGING_SHA: ${{ inputs.expected_sha }}
          STAGING_DEPLOY_APPROVED: "true"
        run: npm run staging:ops -- release

      - name: Run hosted admin role-boundary browser acceptance
        env:
          PLAYWRIGHT_BASE_URL: https://test.mylegacyfortress.com
          NEXT_PUBLIC_SUPABASE_URL: https://supabase-test.mylegacyfortress.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          LEGACY_FORTRESS_ALLOW_STAGING_BROWSER: "true"
          EXPECTED_STAGING_SHA: ${{ inputs.expected_sha }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:staging-admin
